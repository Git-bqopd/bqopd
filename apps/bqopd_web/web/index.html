<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bqopd Web</title>

    <!-- Material Symbols for Toolbar Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDK Compat libraries (Web) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

    <!-- Initialize Firebase -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAKrrl8l8A-3RDzaI04qgp99-vpeMLMR_g",
          authDomain: "bqopd-9ce06.firebaseapp.com",
          projectId: "bqopd-9ce06",
          storageBucket: "bqopd-9ce06.appspot.com",
          messagingSenderId: "17060476719",
          appId: "1:17060476719:web:9c7e201c50938561e2d3da"
        };
        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();
        const storage = firebase.storage();
        const functions = firebase.functions();
    </script>

    <!-- JS Interop Bridge for Pure Dart -->
    <script>
        // --- Auth Bridge ---
        window.loginWithFirebase = (email, password) => firebase.auth().signInWithEmailAndPassword(email, password);
        window.registerWithFirebase = (email, password, username) => {
            return firebase.auth().createUserWithEmailAndPassword(email, password).then(userCredential => {
                var user = userCredential.user;
                var batch = db.batch();
                batch.set(db.collection('Users').doc(user.uid), {
                    uid: user.uid, email: user.email, username: username,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    Editor: false, bio: '', firstName: '', lastName: ''
                });
                batch.set(db.collection('usernames').doc(username.toLowerCase()), {
                    uid: user.uid, email: user.email, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                return batch.commit();
            });
        };
        window.logoutFromFirebase = () => firebase.auth().signOut();
        window.getCurrentUserId = () => firebase.auth().currentUser ? firebase.auth().currentUser.uid : null;
        window.getCurrentUserEmail = () => firebase.auth().currentUser ? firebase.auth().currentUser.email : null;
        window.onAuthStateChangedListener = (callback) => {
            firebase.auth().onAuthStateChanged(user => callback(user ? user.uid : null, user ? user.email : null));
        };

        // --- Data Serialization ---
        function serializeFirebaseData(data) {
            if (data === null || data === undefined) return data;
            if (data.toDate && typeof data.toDate === 'function') return { __type: 'timestamp', iso: data.toDate().toISOString() };
            if (Array.isArray(data)) return data.map(serializeFirebaseData);
            if (typeof data === 'object') {
                let res = {};
                for (let key in data) res[key] = serializeFirebaseData(data[key]);
                return res;
            }
            return data;
        }

        function parseFirebaseOps(obj) {
            if (obj === null || typeof obj !== 'object') return obj;
            if (Array.isArray(obj)) return obj.map(parseFirebaseOps);
            if (obj.__op === 'serverTimestamp') return firebase.firestore.FieldValue.serverTimestamp();
            if (obj.__op === 'increment') return firebase.firestore.FieldValue.increment(obj.value);
            if (obj.__op === 'arrayUnion') return firebase.firestore.FieldValue.arrayUnion(...obj.values);
            if (obj.__op === 'arrayRemove') return firebase.firestore.FieldValue.arrayRemove(...obj.values);
            if (obj.__op === 'delete') return firebase.firestore.FieldValue.delete();
            let res = {};
            for (let key in obj) res[key] = parseFirebaseOps(obj[key]);
            return res;
        }

        // --- Database & Storage Bridge ---
        window.fsGetDoc = (path) => {
            return db.doc(path).get()
                .then(d => JSON.stringify({id: d.id, path: d.ref.path, exists: d.exists, data: d.exists ? serializeFirebaseData(d.data()) : null}))
                .catch(err => JSON.stringify({id: '', path: path, exists: false, error: err.message}));
        };

        window.fsListenDoc = (path, dartCallback) => {
            return db.doc(path).onSnapshot(
                d => dartCallback(JSON.stringify({id: d.id, path: d.ref.path, exists: d.exists, data: d.exists ? serializeFirebaseData(d.data()) : null})),
                err => console.error("fsListenDoc error on path " + path + ":", err)
            );
        };

        window.fsListenQuery = (path, field, op, valueJson, orderBy, desc, dartCallback) => {
            let q = db.collection(path);
            if (field && op && valueJson) q = q.where(field, op, JSON.parse(valueJson));
            if (orderBy) q = q.orderBy(orderBy, desc ? 'desc' : 'asc');
            return q.onSnapshot(
                s => {
                    let docs = s.docs.map(d => ({id: d.id, path: d.ref.path, exists: d.exists, data: serializeFirebaseData(d.data())}));
                    dartCallback(JSON.stringify(docs));
                },
                err => console.error("fsListenQuery error on path " + path + ":", err)
            );
        };

        window.fsUpdateDoc = (path, dataStr) => db.doc(path).update(parseFirebaseOps(JSON.parse(dataStr))).catch(err => { console.error("fsUpdateDoc error:", err); throw err; });
        window.fsSetDoc = (path, dataStr, merge) => db.doc(path).set(parseFirebaseOps(JSON.parse(dataStr)), {merge: merge}).catch(err => { console.error("fsSetDoc error:", err); throw err; });
        window.fsDeleteDoc = (path) => db.doc(path).delete().catch(err => { console.error("fsDeleteDoc error:", err); throw err; });
        window.fsAddDoc = (path, dataStr) => db.collection(path).add(parseFirebaseOps(JSON.parse(dataStr))).then(r => r.id).catch(err => { console.error("fsAddDoc error:", err); throw err; });

        window.fsQuery = (path, field, op, valueJson, orderBy) => {
            let q = db.collection(path);
            if (field && op && valueJson) q = q.where(field, op, JSON.parse(valueJson));
            if (orderBy) q = q.orderBy(orderBy);
            return q.get()
                .then(s => JSON.stringify(s.docs.map(d => ({id: d.id, path: d.ref.path, exists: d.exists, data: serializeFirebaseData(d.data())}))))
                .catch(err => { console.error("fsQuery error:", err); return JSON.stringify([]); });
        };

        window.fnCall = (name, dataStr) => functions.httpsCallable(name)(JSON.parse(dataStr)).then(r => JSON.stringify(r.data)).catch(err => { console.error("fnCall error:", err); throw err; });
        window.stUpload = (path, bytes, contentType) => storage.ref(path).put(bytes, {contentType: contentType}).then(s => s.ref.getDownloadURL()).catch(err => { console.error("stUpload error:", err); throw err; });
    </script>

    <script src="main.dart.js" defer></script>
</head>
<body>
</body>
</html>
