name: bqopd_web
description: The bqopd fanzine platform - Jaspr Web App.
publish_to: none

environment:
  sdk: ^3.11.0

jaspr:
  mode: server

dependencies:
  jaspr: ^0.23.3
  jaspr_router: ^0.9.0
  bloc: ^8.1.4
  http: ^1.1.0
  bqopd_core:
    path: ../../packages/bqopd_core

dev_dependencies:
  jaspr_builder: ^0.23.3
  build_runner: ">=2.14.0 <2.15.2"
  build_web_compilers: ^4.5.1
  lints: ^5.0.0